    <link rel="stylesheet" href="common.css">
    <style>
        /* 优秀校友页面专用样式 */
        .alumni-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("https://aka.doubaocdn.com/s/p2NHNrwf3Y") center/cover no-repeat;
            z-index: 0;
            filter: brightness(0.35);
        }

        .alumni-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(10,10,15,0.6) 0%, rgba(10,10,15,0.85) 100%);
        }

        /* 鼠标流水聚光灯效果：Canvas实现自然渐隐 */
        #spotlight-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .alumni-section {
            min-height: 100vh;
            padding: 120px 60px 80px;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 3D 环形旋转容器 */
        .ring-stage {
            width: 100%;
            height: 520px;
            margin-top: 40px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1400px;
        }

        .ring-container {
            position: relative;
            width: 280px;
            height: 380px;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .ring-card {
            position: absolute;
            top: 0;
            left: 0;
            width: 280px;
            height: 380px;
            border-radius: 16px;
            overflow: hidden;
            backface-visibility: hidden;
            border: 2px solid rgba(0, 245, 255, 0.25);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
            cursor: pointer;
        }

        .ring-card.active-card {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 40px rgba(0, 245, 255, 0.4), 0 15px 50px rgba(0, 0, 0, 0.6);
        }

        .ring-card-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
        }

        .ring-card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(10,10,15,0.3) 0%, rgba(10,10,15,0.7) 60%, rgba(10,10,15,0.92) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 30px 25px;
            transition: background 0.4s ease;
        }

        .ring-card.active-card .ring-card-overlay {
            background: linear-gradient(180deg, rgba(0,245,255,0.05) 0%, rgba(10,10,15,0.65) 50%, rgba(10,10,15,0.9) 100%);
        }

        .ring-card-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .ring-card-info {
            font-size: 14px;
            color: var(--accent-cyan);
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 12px;
        }

        .ring-card-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .ring-card-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
            padding: 8px 20px;
            background: rgba(0, 245, 255, 0.15);
            border: 1px solid rgba(0, 245, 255, 0.4);
            border-radius: 6px;
            color: var(--accent-cyan);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            width: fit-content;
        }

        .ring-card-link:hover {
            background: var(--accent-cyan);
            color: var(--bg-primary);
            box-shadow: var(--glow-cyan);
        }

        /* 空位卡片 */
        .ring-card-empty .ring-card-bg {
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary));
        }

        .ring-card-empty .ring-card-overlay {
            background: linear-gradient(180deg, rgba(10,10,15,0.5) 0%, rgba(10,10,15,0.8) 100%);
            align-items: center;
            justify-content: center;
        }

        .ring-card-empty .ring-card-placeholder {
            text-align: center;
        }

        .ring-card-empty .ring-card-placeholder-icon {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.4;
        }

        .ring-card-empty .ring-card-placeholder-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            color: var(--text-muted);
            letter-spacing: 2px;
        }

        .ring-card-empty .ring-card-placeholder-sub {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 8px;
            opacity: 0.7;
        }

        /* 导航箭头 */
        .ring-nav {
            display: flex;
            gap: 30px;
            margin-top: 40px;
            align-items: center;
        }

        .ring-arrow {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid rgba(0, 245, 255, 0.4);
            background: var(--bg-secondary);
            color: var(--accent-cyan);
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .ring-arrow:hover {
            border-color: var(--accent-cyan);
            box-shadow: var(--glow-cyan);
            transform: scale(1.1);
        }

        .ring-position-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: var(--text-secondary);
            letter-spacing: 2px;
            min-width: 80px;
            text-align: center;
        }

        .ring-position-label .current {
            color: var(--accent-cyan);
            font-size: 20px;
            font-weight: 700;
        }

        /* 底部指示器 */
        .ring-indicators {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .ring-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .ring-dot.active {
            background: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 245, 255, 0.6);
            transform: scale(1.4);
        }

        @media (max-width: 768px) {
            .alumni-section {
                padding: 100px 20px 60px;
            }
            .ring-stage {
                height: 420px;
            }
            .ring-container,
            .ring-card {
                width: 220px;
                height: 310px;
            }
            .ring-card-name {
                font-size: 18px;
            }
        }
    </style>

    <script>
        // 鼠标流水聚光灯：Canvas实现，滑过处背景图清晰显示，离开后自然渐隐
        (function () {
            var canvas = document.getElementById('spotlight-canvas');
            if (!canvas) return;
            var ctx = canvas.getContext('2d');
            var bgImg = new Image();
            bgImg.crossOrigin = 'anonymous';
            var imgReady = false;
            var mouseX = -999, mouseY = -999;
            var prevX = -999, prevY = -999;
            var isMoving = false;
            var moveTimer = null;

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            bgImg.onload = function () { imgReady = true; };
            bgImg.src = 'https://aka.doubaocdn.com/s/p2NHNrwf3Y';

            // 鼠标移动时绘制清晰区域
            document.addEventListener('mousemove', function (e) {
                mouseX = e.clientX;
                mouseY = e.clientY;
                isMoving = true;
                clearTimeout(moveTimer);
                moveTimer = setTimeout(function () { isMoving = false; }, 200);
            });

            function render() {
                // 每帧逐渐淡出已绘制内容，实现自然渐隐
                ctx.globalCompositeOperation = 'destination-out';
                ctx.fillStyle = 'rgba(0,0,0,0.04)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 鼠标移动时在轨迹上绘制清晰背景
                if (imgReady && (isMoving || prevX !== -999)) {
                    ctx.globalCompositeOperation = 'source-over';
                    // 在当前和上一个鼠标位置之间插值绘制，形成流畅轨迹
                    var dx = mouseX - prevX;
                    var dy = mouseY - prevY;
                    var dist = Math.sqrt(dx * dx + dy * dy);
                    var steps = Math.max(1, Math.ceil(dist / 8));
                    for (var i = 0; i <= steps; i++) {
                        var t = i / steps;
                        var x = prevX + dx * t;
                        var y = prevY + dy * t;
                        var r = 80;
                        var grad = ctx.createRadialGradient(x, y, 0, x, y, r);
                        grad.addColorStop(0, 'rgba(255,255,255,1)');
                        grad.addColorStop(0.4, 'rgba(255,255,255,0.5)');
                        grad.addColorStop(1, 'rgba(255,255,255,0)');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(x, y, r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    prevX = mouseX;
                    prevY = mouseY;
                    if (!isMoving) { prevX = -999; prevY = -999; }
                }

                requestAnimationFrame(render);
            }

            // 先用背景图填充，再通过混合模式只保留鼠标轨迹区域
            // 使用 clip 策略：先绘制圆形遮罩，再绘制背景图
            function renderWithBg() {
                // 淡出
                ctx.globalCompositeOperation = 'destination-out';
                ctx.fillStyle = 'rgba(0,0,0,0.04)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (imgReady && (isMoving || (prevX !== -999))) {
                    ctx.globalCompositeOperation = 'source-over';
                    var dx = mouseX - prevX;
                    var dy = mouseY - prevY;
                    var dist = Math.sqrt(dx * dx + dy * dy);
                    var steps = Math.max(1, Math.ceil(dist / 8));
                    for (var i = 0; i <= steps; i++) {
                        var t = i / steps;
                        var x = prevX + dx * t;
                        var y = prevY + dy * t;
                        var r = 80;
                        // 用圆形裁剪绘制背景图
                        ctx.save();
                        ctx.beginPath();
                        ctx.arc(x, y, r, 0, Math.PI * 2);
                        ctx.clip();
                        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
                        ctx.restore();
                        // 软化边缘
                        ctx.globalCompositeOperation = 'destination-out';
                        var edgeGrad = ctx.createRadialGradient(x, y, r * 0.6, x, y, r);
                        edgeGrad.addColorStop(0, 'rgba(0,0,0,0)');
                        edgeGrad.addColorStop(1, 'rgba(0,0,0,0.6)');
                        ctx.fillStyle = edgeGrad;
                        ctx.beginPath();
                        ctx.arc(x, y, r, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.globalCompositeOperation = 'source-over';
                    }
                    prevX = mouseX;
                    prevY = mouseY;
                    if (!isMoving) { prevX = -999; prevY = -999; }
                }

                requestAnimationFrame(renderWithBg);
            }

            renderWithBg();
        })();
    </script>
